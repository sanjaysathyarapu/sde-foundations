name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew test --no-daemon

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every entry must follow the template's required headings.
      - name: Check entry structure
        run: |
          status=0
          for f in $(find 0*-* -mindepth 2 -name README.md 2>/dev/null); do
            for h in "## 1. The problem" "## 7. Interview Q&A"; do
              grep -qF "$h" "$f" || { echo "::error file=$f::missing heading '$h'"; status=1; }
            done
          done
          exit $status
